name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy numba opencv-python-headless pytest ruff
      - run: ruff check --select F,E9 pi tools
      - run: cd pi && python -m pytest -q
